# Render Blueprint for the Kestrel Bank API (no database required:
# data is loaded from backend/data/seed.json into memory on every start).
services:
  - type: web
    name: kestrel-bank-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.1
      - key: JWT_SECRET
        generateValue: true
      # Comma-separated browser origins allowed to call the API, e.g.
      # https://<your-user>.github.io  (origin only - no path, no trailing slash)
      - key: CORS_ORIGINS
        sync: false
      # Render terminates TLS in front of the app; trust one proxy hop so
      # rate limiting and audit logs see the real client IP.
      - key: TRUST_PROXY
        value: "1"
      # Optional: restore the seed periodically (minutes). 0 = only on restart.
      - key: AUTO_RESET_MINUTES
        value: "0"
